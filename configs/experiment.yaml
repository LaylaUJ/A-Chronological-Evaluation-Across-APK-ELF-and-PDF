experiment:
  name: tcfs_baseline
  seed: 42
  description: Baseline temporal-consistency feature-selection experiment

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  target_column: label
  time_column: timestamp

split:
  strategy: temporal
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

model:
  name: lightgbm
  params:
    objective: binary
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    n_jobs: 1
    verbosity: -1

outputs:
  figures_dir: outputs/figures
  models_dir: outputs/models
  predictions_dir: outputs/predictions
  reports_dir: outputs/reports

